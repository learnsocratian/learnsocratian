<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Foundations of Mathematics | Learn Socratian</title>
  <meta name="description" content="Explore the foundations of mathematics with Learn Socratian.">

  <link rel="stylesheet" href="/assets/css/styles.css">

  <style>
    html,body{margin:0}
    .foundations-approved-page{
      width:100%;
      padding:0;
      overflow-x:hidden;
      background:#f7faff;
    }
    .foundations-approved-visual{
      position:relative;
      width:min(100%,1536px);
      margin:0 auto;
      line-height:0;
    }
    .foundations-approved-visual img{
      display:block;
      width:100%;
      height:auto;
      max-height:calc(100vh - 76px);
      object-fit:contain;
      object-position:top center;
      margin:0 auto;
    }
    .brick-hotspot{
      position:absolute;
      z-index:2;
      border-radius:9px;
      text-decoration:none;
      cursor:pointer;
      transition:box-shadow .15s ease, transform .15s ease;
    }
    .brick-hotspot:hover,
    .brick-hotspot:focus-visible{
      box-shadow:inset 0 0 0 3px rgba(255,255,255,.88),0 4px 14px rgba(16,40,74,.25);
      transform:translateY(-2px);
      outline:none;
    }
    @media(max-width:760px){
      .foundations-approved-visual img{
        max-height:none;
      }
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main class="foundations-approved-page">
    <div class="foundations-approved-visual">
      <img
        src="/assets/images/mathematics/foundations-building-approved.png"
        alt="Foundations of Mathematics shown as seven foundation blocks supporting future levels from Grade 9 through University."
        width="1536"
        height="952"
      >
      <a class="brick-hotspot" href="/courses/mathematics/topics/sets/" aria-label="Sets"
         style="left:12.2396%;top:70.3782%;width:9.1146%;height:13.4454%"></a>
      <a class="brick-hotspot" href="/courses/mathematics/topics/numeration/" aria-label="Numeration"
         style="left:21.4193%;top:70.3782%;width:10.4818%;height:13.4454%"></a>
      <a class="brick-hotspot" href="/courses/mathematics/foundations/algebra.html" aria-label="Algebra"
         style="left:32.0312%;top:70.3782%;width:10.6120%;height:13.4454%"></a>
      <a class="brick-hotspot" href="/courses/mathematics/foundations/geometry.html" aria-label="Geometry"
         style="left:42.7734%;top:70.3782%;width:11.1328%;height:13.4454%"></a>
      <a class="brick-hotspot" href="/courses/mathematics/foundations/measurement.html" aria-label="Measurement"
         style="left:54.0365%;top:70.3782%;width:12.1745%;height:13.4454%"></a>
      <a class="brick-hotspot" href="/courses/mathematics/foundations/data-probability.html" aria-label="Database Management and Probability"
         style="left:66.3411%;top:70.3782%;width:12.3047%;height:13.4454%"></a>
      <a class="brick-hotspot" href="/courses/mathematics/foundations/financial-literacy.html" aria-label="Financial Literacy"
         style="left:78.7109%;top:70.3782%;width:12.3698%;height:13.4454%"></a>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
