    <style>
      /* Mathematics page — compact one-screen directory */
      .mathematics-hero--compact {
        padding-block: clamp(1.25rem, 2.5vw, 2.25rem);
      }

      .mathematics-hero__container--compact {
        display: grid;
        grid-template-columns: minmax(250px, 0.78fr) minmax(0, 1.35fr);
        gap: clamp(1.5rem, 3vw, 3rem);
        align-items: center;
      }

      .mathematics-hero__content--compact {
        min-width: 0;
      }

      .mathematics-hero__title--compact {
        margin: 0.15rem 0 1rem;
        font-size: clamp(2rem, 3.3vw, 3rem);
        line-height: 1.05;
      }

      .mathematics-quick-links {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: clamp(0.85rem, 1.5vw, 1.25rem);
        align-items: start;
      }

      .mathematics-quick-column {
        min-width: 0;
        padding: 0.9rem;
        border: 1px solid rgba(111, 90, 168, 0.18);
        border-radius: 0.9rem;
        background: rgba(255, 255, 255, 0.88);
      }

      .mathematics-quick-column h2 {
        margin: 0 0 0.6rem;
        font-size: clamp(1.05rem, 1.5vw, 1.3rem);
      }

      .mathematics-quick-list {
        display: grid;
        gap: 0.42rem;
      }

      .mathematics-quick-list a {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.25rem 0.7rem;
        min-height: 2.35rem;
        padding: 0.55rem 0.7rem;
        border: 1px solid rgba(111, 90, 168, 0.15);
        border-radius: 0.65rem;
        background: #fff;
        color: inherit;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .mathematics-quick-list a:hover,
      .mathematics-quick-list a:focus-visible {
        border-color: rgba(111, 90, 168, 0.5);
        background: rgba(111, 90, 168, 0.055);
      }

      .mathematics-quick-list small {
        color: var(--color-text-muted, #6b6475);
        font-size: 0.72rem;
        font-weight: 500;
      }

      @media (max-width: 56rem) {
        .mathematics-hero__container--compact {
          grid-template-columns: minmax(210px, 0.72fr) minmax(0, 1.28fr);
          gap: 1.25rem;
        }

        .mathematics-quick-list a {
          font-size: 0.84rem;
          padding: 0.48rem 0.6rem;
        }
      }

      @media (max-width: 44rem) {
        .mathematics-hero__container--compact {
          grid-template-columns: 1fr;
        }

        .mathematics-hero__visual {
          max-width: 32rem;
          margin-inline: auto;
        }

        .mathematics-quick-links {
          grid-template-columns: 1fr;
        }
      }
    </style>

  
    <style>
      /* Mathematics hero directory refinement */

      .mathematics-quick-column {

        min-height: 0;
        flex-direction: column;
        padding: 0.72rem;
        border-radius: 0.8rem;
        background:

      .mathematics-quick-column h2 {

        font-size: 1rem;
        line-height: 1.1;
      }

      .mathematics-quick-list {
        display: grid;
        flex: 1;

        gap: 0.34rem;

      .mathematics-quick-list a {
        min-height: 0;

        border-radius: 0.55rem;
        font-size: clamp(0.75rem, 0.95vw, 0.86rem);

      .mathematics-quick-list a::after {

        font-size: 0.86em;

      .mathematics-quick-list small {

        line-height: 1.05;

      @media (min-width: 45rem) {

          grid-template-rows: repeat(6, minmax(0, 1fr));
        }

        .mathematics-quick-column:last-child .mathematics-quick-list {
          grid-template-rows: repeat(8, minmax(0, 1fr));
        }
      }
    </style>

    <style>
      .mathematics-quick-list .has-tooltip {
        position: relative;
      }

      @media (hover: hover) and (pointer: fine) {
        .mathematics-quick-list .has-tooltip::before {
          content: attr(data-tooltip);
          position: absolute;
          left: 50%;
          bottom: calc(100% + 7px);
          z-index: 20;
          width: max-content;
          max-width: 220px;
          padding: 0.4rem 0.55rem;
          border: 1px solid rgba(111, 90, 168, 0.2);
          border-radius: 0.45rem;
          background: #fff;
          color: #302a3d;
          box-shadow: 0 5px 14px rgba(48, 42, 61, 0.12);
          font-size: 0.72rem;
          font-weight: 500;
          line-height: 1.2;
          opacity: 0;
          pointer-events: none;
          transform: translate(-50%, 3px);
          transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .mathematics-quick-list .has-tooltip:hover::before,
        .mathematics-quick-list .has-tooltip:focus-visible::before {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
    </style>


    <style>
      /* Topics: fixed-height, two-column directory */
      @media (min-width: 45rem) {
        .mathematics-quick-column:last-child .mathematics-quick-list {
