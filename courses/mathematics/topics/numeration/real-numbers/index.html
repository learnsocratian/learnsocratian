<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Real Numbers | Learn Socratian</title>
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
.real-numbers-page{
  --rn-lav:#6f5aa8;
  --rn-soft:#f7f4fb;
  --rn-ink:#302a3d;
  --rn-muted:#746d7d;
  --rn-line:#ddd6e9;
  max-width:1120px;
  margin:auto;
  padding:14px 22px 20px;
  color:var(--rn-ink);
}
.real-numbers-page *{box-sizing:border-box}
.real-numbers-page .crumb{font-size:13px;color:var(--rn-muted);margin-bottom:4px}
.real-numbers-page h1{font-family:Georgia,serif;font-size:31px;margin:0 0 10px}
.real-numbers-page .layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(220px,24vw,300px);
  gap:clamp(12px,1.8vw,22px);
  align-items:center;
}
.real-numbers-page .poster{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:0;
  max-height:min(52vh,430px);
  border:0;
  border-radius:14px;
  overflow:hidden;
  background:linear-gradient(135deg,#ddd4eb,#f4eff9);
  box-shadow:0 7px 22px rgba(57,43,88,.08);
  display:grid;
  place-items:center;
}
.real-numbers-page .poster-title{
  font-family:Georgia,serif;
  font-size:clamp(24px,4vw,42px);
  color:#4b3e67;
  text-align:center;
  padding:24px;
}
.real-numbers-page .topics{
  background:#fff;
  border:1px solid var(--rn-line);
  border-radius:14px;
  padding:clamp(11px,1.2vw,15px);
  display:flex;
  flex-direction:column;
  box-shadow:0 7px 22px rgba(57,43,88,.05);
  align-self:center;
}
.real-numbers-page .topics h2{font-family:Georgia,serif;font-size:18px;margin:0 0 9px}
.real-numbers-page .topic-list{display:grid;grid-template-columns:1fr;gap:8px}
.real-numbers-page .topic{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:clamp(8px,1vw,10px) clamp(9px,1vw,11px);
  min-height:clamp(38px,4.5vw,42px);
  border:1px solid var(--rn-line);
  border-radius:9px;
  background:#fff;
  color:var(--rn-ink);
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:.15s ease;
}
.real-numbers-page .topic:hover,
.real-numbers-page .topic:focus-visible{
  border-color:#b8aad2;
  background:var(--rn-soft);
  transform:translateX(2px);
}
.real-numbers-page .topic .arrow{color:var(--rn-lav);font-size:15px;flex:0 0 auto}
.real-numbers-page .back{margin:9px 0 0;font-size:13px}
.real-numbers-page .back a{color:var(--rn-lav);text-decoration:none}

@media(max-width:900px){
  .real-numbers-page .layout{grid-template-columns:minmax(0,1fr) clamp(210px,30vw,260px)}
  .real-numbers-page .topic{font-size:12.5px}
}
@media(max-width:760px){
  .real-numbers-page{padding:12px 16px 18px}
  .real-numbers-page .layout{grid-template-columns:1fr;gap:12px}
  .real-numbers-page .poster{aspect-ratio:16/9;max-height:none}
  .real-numbers-page .topics{width:100%;height:auto!important}
  .real-numbers-page .topic-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
@media(max-width:480px){
  .real-numbers-page .topic-list{grid-template-columns:1fr}
  .real-numbers-page h1{font-size:28px}
}
</style>
</head>
<body>
<div id="site-header"></div>

<main class="real-numbers-page">
  <div class="crumb">Mathematics › Numeration › Real Numbers</div>
  <h1>Real Numbers</h1>

  <div class="layout">
    <!-- Replace this placeholder with the actual Real Numbers video poster/player
         only when the real poster/video asset paths are available. -->
    <div class="poster" aria-label="Real Numbers video area">
      <div class="poster-title">Real Numbers</div>
    </div>

    <aside class="topics" aria-label="Real Numbers topics">
      <h2>Topics</h2>
      <div class="topic-list">
        <a class="topic" href="natural-numbers/"><span>Natural Numbers (ℕ)</span><span class="arrow">→</span></a>
        <a class="topic" href="integers/"><span>Integers (ℤ)</span><span class="arrow">→</span></a>
        <a class="topic" href="rational-numbers/"><span>Rational Numbers (ℚ)</span><span class="arrow">→</span></a>
        <a class="topic" href="irrational-numbers/"><span>Irrational Numbers (ℝ ∖ ℚ)</span><span class="arrow">→</span></a>
      </div>
    </aside>
  </div>

  <p class="back"><a href="../">← Back to Numeration</a></p>
</main>

<div id="site-footer"></div>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
