<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numeration | Learn Socratian</title>
<style>
:root{
  --lav:#6f5aa8;--lav2:#806db5;--soft:#f7f4fb;--ink:#302a3d;
  --muted:#746d7d;--line:#ddd6e9;--white:#fff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#faf9fc;color:var(--ink)}



 
main{max-width:1120px;margin:auto;padding:14px 22px 20px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}
h1{font-family:Georgia,serif;font-size:31px;margin:0 0 10px}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(220px,24vw,300px);
  gap:clamp(12px,1.8vw,22px);
  align-items:center;
}
.poster{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  min-height:0;
  max-height:min(52vh,430px);
  border:0;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  background:
    linear-gradient(rgba(25,18,38,.08),rgba(25,18,38,.08)),
    url("/assets/images/video-posters/numeration-first-frame.jpg") center/cover no-repeat,
    linear-gradient(135deg,#ddd4eb,#f4eff9);
  box-shadow:0 7px 22px rgba(57,43,88,.08);
}
.poster::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(22,16,33,.22),transparent 45%);
  pointer-events:none;
}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62px;height:62px;border:2px solid rgba(255,255,255,.95);border-radius:50%;
  display:grid;place-items:center;color:#fff;background:rgba(48,35,69,.62);
  font-size:23px;z-index:2;box-shadow:0 5px 18px rgba(0,0,0,.22)
}
.topics{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:clamp(11px,1.2vw,15px);display:flex;flex-direction:column;
  box-shadow:0 7px 22px rgba(57,43,88,.05);
  align-self:center;
}
.topics h2{font-family:Georgia,serif;font-size:18px;margin:0 0 9px}
.topic-list{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}
.topic{
  display:flex;justify-content:space-between;align-items:center;
  padding:clamp(8px,1vw,10px) clamp(9px,1vw,11px);min-height:clamp(38px,4.5vw,42px);border:1px solid var(--line);
  border-radius:9px;background:#fff;color:var(--ink);text-decoration:none;
  font-size:13px;font-weight:700;transition:.15s ease;
}
.topic:hover,.topic:focus-visible{
  border-color:#b8aad2;background:var(--soft);transform:translateX(2px);
}
.topic .arrow{color:var(--lav);font-size:15px}
.back{margin:9px 0 0;font-size:13px}
.back a{color:var(--lav);text-decoration:none}
dialog{width:min(94vw,1080px);height:min(90vh,720px);padding:0;border:0;border-radius:15px;overflow:hidden}
dialog::backdrop{background:rgba(18,13,27,.78)}
.dialog-bar{height:52px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;background:#fff;border-bottom:1px solid var(--line)}
.close{border:0;background:transparent;font-size:28px;cursor:pointer}
.video-wrap{height:calc(100% - 52px);background:#000}
.video-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
@media(max-width:900px){
  .layout{
    grid-template-columns:minmax(0,1fr) clamp(210px,30vw,260px);
  }
  .topic{font-size:12.5px}
}

@media(max-width:760px){
  
  main{padding:12px 16px 18px}
  .layout{grid-template-columns:1fr;gap:12px}
  .poster{aspect-ratio:16/9;max-height:none}
  .topics{width:100%;height:auto!important}
  .topic-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}

@media(max-width:480px){
  .topic-list{grid-template-columns:1fr}
  h1{font-size:28px}
}
</style>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <div class="crumb">Mathematics › Numeration</div>
  <h1>Numeration</h1>

  <div class="layout" id="numerationLayout">
    <button class="poster" id="openVideo" type="button" aria-label="Open Numeration video">
      <span class="play" aria-hidden="true">▶</span>
    </button>

    <aside class="topics" id="topicsPanel">
      <h2>Topics</h2>
      <div class="topic-list">
        <a class="topic" href="operations/"><span>Operations</span><span class="arrow">→</span></a>
        <a class="topic" href="divisibility/"><span>Divisibility</span><span class="arrow">→</span></a>
        <a class="topic" href="exponents/"><span>Exponents</span><span class="arrow">→</span></a>
        <a class="topic" href="real-numbers/"><span>Real Numbers</span><span class="arrow">→</span></a>
      </div>
    </aside>
  </div>

  <p class="back"><a href="/courses/mathematics/">← Back to Mathematics</a></p>
</main>

<div id="site-footer"></div>

<dialog id="videoDialog">
  <div class="dialog-bar">
    <strong>Numeration — Video Lesson</strong>
    <button class="close" id="closeVideo" type="button" aria-label="Close video">×</button>
  </div>
  <div class="video-wrap">
    <video id="numerationVideo" controls playsinline preload="metadata"
      poster="/assets/images/numeration/numeration-film-poster.jpg">
      <source src="/assets/video/learn-socratian-numeration-film.mp4" type="video/mp4">
    </video>
  </div>
</dialog>

<script>
const poster=document.getElementById("openVideo");
const panel=document.getElementById("topicsPanel");
const dialog=document.getElementById("videoDialog");
const video=document.getElementById("numerationVideo");
const close=document.getElementById("closeVideo");

poster.addEventListener("click",()=>{
  dialog.showModal();
  video.play().catch(()=>{});
});
close.addEventListener("click",()=>{video.pause();dialog.close();});
dialog.addEventListener("close",()=>video.pause());
</script>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
