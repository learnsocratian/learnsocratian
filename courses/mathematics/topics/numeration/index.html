<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Numeration Preview | Learn Socratian</title>
<style>
:root{--lav:#6f5aa8;--soft:#f4f0fa;--ink:#2f2b3a;--muted:#6c6677;--line:#ddd5ea}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#faf9fc;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line)}
.header-inner{max-width:1180px;margin:auto;padding:12px 22px;display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:700;color:var(--lav);font-size:18px}
nav{display:flex;gap:18px;font-size:14px}nav a{color:var(--ink);text-decoration:none}
main{max-width:1180px;margin:auto;padding:14px 22px 20px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:5px}
h1{font-family:Georgia,serif;font-size:32px;margin:0 0 10px}
.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(280px,1fr);gap:18px;align-items:stretch}
.left{display:flex;flex-direction:column;height:100%;min-height:0}
.video{
  aspect-ratio:16/9;width:100%;min-height:0;border:1px solid var(--line);border-radius:15px;
  background-image:linear-gradient(rgba(20,16,28,.08),rgba(20,16,28,.08)),url('../../../../assets/images/numeration/numeration-film-poster.jpg');
  background-size:cover;background-position:center;display:grid;place-items:center;cursor:pointer
}
.play{width:72px;height:72px;border:2px solid var(--lav);border-radius:50%;background:#fff;color:var(--lav);display:grid;place-items:center;font-size:26px}
.read{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:14px 16px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700}
.back{margin-top:10px;padding-top:0;margin-bottom:0;font-size:14px}.back a{color:var(--lav)}
.topics{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;display:flex;flex-direction:column;aspect-ratio:auto;height:auto;align-self:start}
.topics h2{font-family:Georgia,serif;font-size:19px;margin:0 0 9px}
.tree{display:flex;flex-direction:column;justify-content:center;gap:10px;flex:1}
.link{display:flex;justify-content:space-between;align-items:center;min-height:34px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-decoration:none;font-size:12.5px;font-weight:700}
.link:hover,.link:focus{border-color:var(--lav);background:var(--soft)}
.level1{margin-left:13px}
.level2{margin-left:26px}
.level3{margin-left:39px}
.group-label{font-weight:700}
dialog{width:min(94vw,1100px);height:90vh;border:0;border-radius:15px;padding:0}
dialog::backdrop{background:rgba(22,18,29,.78)}
.bar{height:55px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}
.close{border:0;background:none;font-size:29px;cursor:pointer}
.video-body{height:calc(100% - 55px);background:#191622;color:#fff;display:grid;place-items:center;text-align:center}
@media(max-width:760px){nav{display:none}.layout{grid-template-columns:1fr}.video{aspect-ratio:16/9;min-height:0}.level1{margin-left:10px}.level2{margin-left:20px}.level3{margin-left:30px}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="brand">Learn Socratian</div><nav><a href="#">Home</a><a href="#">Philosophy</a><a href="#">Courses</a><a href="#">About</a><a href="#">Contact</a><a href="#">Log in</a></nav></div></header>

<main>
<div class="crumb">Mathematics › Numeration</div>
<h1>Numeration</h1>

<div class="layout">
<section class="left">
  <div class="video" id="openVideo"><div class="play">▶</div></div>
  <p class="back"><a href="#">← Back to Mathematics</a></p>
</section>

<aside class="topics">
  <h2>Topics</h2>
  <div class="tree">
    <a class="link" href="operations/"><span>Operations</span><span>→</span></a>
    <a class="link" href="divisibility/"><span>Divisibility</span><span>→</span></a>
    <a class="link" href="exponents/"><span>Exponents</span><span>→</span></a>
    <a class="link" href="real-numbers/"><span>Real Numbers</span><span>→</span></a>
  </div>
</aside>
</div>
</main>

<dialog id="videoDialog">
 <div class="bar"><strong>Numeration — Video Lesson</strong><button class="close" id="closeVideo">×</button></div>
 <div class="video-body"><div><div style="font-size:52px">▶</div><p>Your Numeration video will play here.</p></div></div>
</dialog>
<script>
const d=document.getElementById('videoDialog');
document.getElementById('openVideo').onclick=()=>d.showModal();
document.getElementById('closeVideo').onclick=()=>d.close();

function matchTopicsToVideo(){
  const video=document.querySelector('.video');
  const topics=document.querySelector('.topics');
  if(!video||!topics)return;
  if(window.innerWidth>760){
    topics.style.height=video.getBoundingClientRect().height+'px';
  }else{
    topics.style.height='auto';
  }
}
window.addEventListener('load',matchTopicsToVideo);
window.addEventListener('resize',matchTopicsToVideo);

</script>
</body>
</html>
